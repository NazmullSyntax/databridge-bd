# Local development — PostgreSQL only (backend/frontend পরে যোগ করব)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: databridge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: databridge_dev
    volumes:
      - databridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databridge -d databridge_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  databridge_pgdata:
